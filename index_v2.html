<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>LogLog</title>
    
    <link rel="icon" href="tomato-icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="tomato-icon.jpg">

    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --text: #ffffff; --accent: #ff5f5f; --secondary: #444; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 95vh; overflow-y: auto; }
        .timer { font-size: 5rem; font-weight: 200; margin: 5px 0; font-variant-numeric: tabular-nums; }
        .status { color: #888; letter-spacing: 3px; font-size: 0.8rem; text-transform: uppercase; }
        
        .log-section { margin-top: 20px; border-top: 1px solid #444; padding-top: 20px; }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 8px; font-size: 0.75rem; background: var(--secondary); border-radius: 10px; color: #aaa; cursor: pointer; border: none; outline: none; }
        .tab-btn.active { background: var(--accent); color: white; }
        
        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; min-height: 40px; }
        .chip { padding: 8px 12px; background: #3d3d3d; border-radius: 20px; font-size: 0.85rem; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .chip.selected { border-color: var(--accent); color: var(--accent); background: #3d2d2d; }
        
        textarea { width: 90%; padding: 12px; border-radius: 12px; background: #1a1a1a; color: white; border: 1px solid #444; margin-bottom: 10px; font-size: 1rem; resize: none; outline: none; }
        .send-btn { background: #4a90e2; color: white; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; }
        
        select, .action-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 1rem; margin-top: 10px; cursor: pointer; outline: none; }
        select { background: var(--secondary); color: white; text-align: center; -webkit-appearance: none; }
        .action-btn { background: var(--accent); color: white; font-weight: bold; }
        label { font-size: 0.7rem; color: #666; display: block; text-align: left; margin: 10px 0 -5px 5px; text-transform: uppercase; }
        .setting-link { font-size: 0.6rem; color: #444; margin-top: 15px; cursor: pointer; display: inline-block; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div id="timer-ui">
        <div id="setup-screen">
            <h3 style="font-weight: 300; margin: 0;">LogLog Focus</h3>
            <label>ポモドーロ</label>
            <select id="timerMode">
                <option value="25">25分 - 5分</option>
                <option value="50">50分 - 10分</option>
            </select>
            <label>ログ内容</label>
            <select id="activity">
                <option value="勉強">勉強 ✍️</option>
                <option value="読書">読書 📖</option>
            </select>
            <button id="startBtn" class="action-btn">集中スタート</button>
        </div>
        <div id="timer-screen" style="display:none;">
            <div id="status" class="status">FOCUS</div>
            <div class="timer" id="display">00:00</div>
            <button id="stopBtn" class="action-btn" style="background:#444;">一時停止</button>
        </div>
    </div>

    <div id="log-area" class="log-section">
        <div class="tab-menu">
            <button class="tab-btn active" id="tab-done" onclick="switchTab('done')">Done</button>
            <button class="tab-btn" id="tab-future" onclick="switchTab('future')">Future</button>
        </div>
        <div id="emotion-chips" class="chip-group"></div>
        <textarea id="logMemo" placeholder="一言メモを入力..." rows="2"></textarea>
        <button id="send-log-btn" class="send-btn" onclick="sendQuickLog()">送信</button>
        <div class="setting-link" onclick="setGasUrl()">連携URL設定</div>
    </div>
</div>

<audio id="focusSound" src="雨が降る2.mp3" preload="auto" loop></audio>
<audio id="relaxSound" src="In That Mood.mp3" preload="auto" loop></audio>

<script>
    let timer, timeLeft, isFocus = true, isPaused = false, wakeLock = null;
    let currentTab = 'done';
    let selectedEmotion = "";

    const periods = {
        "今週",
        "今月",
        "今年",
        "いつか"
    };

    function switchTab(tab) {
        currentTab = tab;
        selectedEmotion = "";
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        renderChips();
    }

   function renderChips() {
       const group = document.getElementById('emotion-chips');
       group.innerHTML = "";
       
       if (currentTab !== 'future') {
           return;
       }
       periods.forEach(period => {
           const span = document.createElement('span');
           span.className = 'chip';
           
           if (selectedPeriod === period) {
               span.classList.add('selected');
           }
           
           span.innerText = period;
           
           span.onclick = () => {
               document.querySelectorAll('.chip').forEach(c => {
                   c.classList.remove('selected');
               });
               
               span.classList.add('selected');
               selectedPeriod = period;
           };
           
           group.appendChild(span);
       });
   }

   function sendQuickLog() {
       const memo = document.getElementById('logMemo').value.trim();
       if (!memo) return;

       const period = currentTab === 'future' ? selectedPeriod : "";
       const gasUrl = localStorage.getItem('LOGLOG_GAS_URL');
       
       if (gasUrl) {
           const now = new Date();
           const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
           
           const fetchUrl =
               `${gasUrl}?type=${encodeURIComponent(currentTab)}` +
               `&period=${encodeURIComponent(period)}` +
               `&memo=${encodeURIComponent(memo)}` +
               `&time=${encodeURIComponent(timeStr)}`;
           fetch(fetchUrl, { mode: 'no-cors' })
               .catch(e => console.error("GAS log error:", e));
       } else {
           alert("先に「連携URL設定」からGAS URLを設定してください。");
           return;
       }
       
       document.getElementById('logMemo').value = "";
       
       if (currentTab === 'future') {
           selectedPeriod = "";
           renderChips();
       }
   }
    
    const focusAudio = document.getElementById('focusSound');
    const relaxAudio = document.getElementById('relaxSound');
    const stopBtn = document.getElementById('stopBtn');
    const logArea = document.getElementById('log-area');

    [focusAudio, relaxAudio].forEach(audio => {
        audio.addEventListener('timeupdate', function() {
            const buffer = 0.8;
            if (this.currentTime > this.duration - buffer) {
                this.currentTime = 0;
                this.play().catch(() => {});
            }
        });
    });

    async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }

    function startTimer() {
        timeLeft = parseInt(document.getElementById('timerMode').value) * 60;
        isFocus = true; isPaused = false;
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('timer-screen').style.display = 'block';
        logArea.style.display = 'none';
        requestWakeLock();
        
        focusAudio.currentTime = 0;
        focusAudio.play().catch(() => {});
        runPhase();
    }

    function runPhase() {
        focusAudio.pause();
        relaxAudio.pause();
        if (isFocus) {
            document.getElementById('status').textContent = "FOCUS";
            focusAudio.play().catch(() => {});
        } else {
            document.getElementById('status').textContent = "RELAX";
            relaxAudio.play().catch(() => {});
        }
        startInterval();
    }

    function startInterval() {
        if(timer) clearInterval(timer);
        timer = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                const m = Math.floor(timeLeft / 60); const s = timeLeft % 60;
                document.getElementById('display').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (isFocus) { logFocus(); }
                    else { resetApp(); }
                }
            }
        }, 1000);
    }

    function logFocus() {
        const act = document.getElementById('activity').value;
        const mode = document.getElementById('timerMode').value;
        const gasUrl = localStorage.getItem('LOGLOG_GAS_URL');
        
        // Googleカレンダーへ送信
        if (gasUrl) {
            const title = `🍅${act}`;
            const fetchUrl = `${gasUrl}?title=${encodeURIComponent(title)}&minutes=${mode}`;
            fetch(fetchUrl, { mode: 'no-cors' }).catch(e => console.error("GAS error:", e));
        }

        // 休憩フェーズへ移行（Obsidianは開かない）
        relaxAudio.load();
        isFocus = false;
        timeLeft = (mode === "25") ? 5 * 60 : 10 * 60;
        setTimeout(runPhase, 2000);
    }

    function setGasUrl() {
        const current = localStorage.getItem('LOGLOG_GAS_URL') || "";
        const url = prompt("GASのウェブアプリURLを入力してください:", current);
        if (url !== null) {
            localStorage.setItem('LOGLOG_GAS_URL', url);
            alert("設定を保存しました。");
        }
    }

    function togglePause() {
        isPaused = !isPaused;
        stopBtn.textContent = isPaused ? "再開" : "一時停止";
        if (isPaused) { focusAudio.pause(); relaxAudio.pause(); }
        else { if (isFocus) focusAudio.play(); else relaxAudio.play(); }
    }

    function resetApp() {
        clearInterval(timer); if (wakeLock) wakeLock.release();
        focusAudio.pause(); relaxAudio.pause();
        document.getElementById('setup-screen').style.display = 'block';
        document.getElementById('timer-screen').style.display = 'none';
        logArea.style.display = 'block';
    }

    document.getElementById('startBtn').addEventListener('click', startTimer);
    stopBtn.addEventListener('click', togglePause);
    switchTab('done');
</script>
</body>
</html>
