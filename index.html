<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    
    <!-- 【ここを追加】あなたが選んだトマトのアイコンを設定します -->
    <!-- このHTMLと同じ場所に 'tomato-icon.jpg' (選んだトマトの画像) を置いてください -->
    <link rel="icon" href="tomato-icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="tomato-icon.jpg">

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #F5F5F0; /* ジャパンディな背景色 */
            color: #4A4A4A;
        }
        #timer { font-size: 80px; font-weight: bold; margin: 20px 0; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        #startBtn { background-color: #BC6C25; color: white; }
        #pauseBtn { background-color: #A8A8A8; color: white; }
        #resetBtn { background-color: #606060; color: white; }
        select, input { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div id="timer">25:00</div>

    <div class="controls">
        <select id="timerMode">
            <option value="25">集中 (25分)</option>
            <option value="50">集中 (50分)</option>
            <option value="5">休憩 (5分)</option>
        </select>
        <input type="text" id="activity" placeholder="何をする？" value="勉強">
    </div>

    <div class="controls">
        <button id="startBtn">START</button>
        <button id="pauseBtn">PAUSE</button>
        <button id="resetBtn">RESET</button>
    </div>

    <!-- オーディオファイル（GitHubのリポジトリに配置してください） -->
    <audio id="focusAudio" src="rain.mp3" preload="auto"></audio>

    <script>
        let timeLeft;
        let timerId = null;
        let isPaused = false;
        const timerDisplay = document.getElementById('timer');
        const focusAudio = document.getElementById('focusAudio');

        // --- 音楽ループ処理 (以前の修正：10秒バッファで「プツッ」を解消) ---
        focusAudio.addEventListener('timeupdate', function() {
            const buffer = 10.0; 
            if(this.currentTime > this.duration - buffer){
                this.currentTime = 0;
                this.play();
            }
        });

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (!isPaused) {
                timeLeft = document.getElementById('timerMode').value * 60;
            }
            isPaused = false;
            
            if (timerId) clearInterval(timerId);
            focusAudio.play();

            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    focusAudio.pause();
                    logToObsidian();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (timerId) {
                clearInterval(timerId);
                focusAudio.pause();
                isPaused = true;
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            focusAudio.pause();
            focusAudio.currentTime = 0;
            isPaused = false;
            timeLeft = document.getElementById('timerMode').value * 60;
            updateDisplay();
        }

        // --- Obsidian/Thino連携 (以前の修正：改行ブーストで空のノートでも認識) ---
        function logToObsidian() {
            const act = document.getElementById('activity').value;
            const mode = document.getElementById('timerMode').value;
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            // 2行の改行を入れることで、Thinoにログとして確実に認識させます
            const note = `\n\n- ${timeStr} 🍅${act} (${mode}分間集中) #log/focus\n`;
            
            const uri = `obsidian://advanced-uri?daily=true&data=${encodeURIComponent(note)}&mode=append`;
            window.location.href = uri;
        }

        document.getElementById('startBtn').addEventListener('click', startTimer);
        document.getElementById('pauseBtn').addEventListener('click', pauseTimer);
        document.getElementById('resetBtn').addEventListener('click', resetTimer);
        document.getElementById('timerMode').addEventListener('change', resetTimer);

        resetTimer();
    </script>
</body>
</html>
