<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Asakatsu Focus</title>
    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --text: #ffffff; --accent: #ff5f5f; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 85%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .timer { font-size: 5.5rem; font-weight: 200; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .status { color: #888; letter-spacing: 3px; font-size: 0.9rem; text-transform: uppercase; }
        select, button { width: 100%; padding: 16px; border-radius: 15px; border: none; font-size: 1.1rem; margin-top: 15px; }
        select { background: #444; color: white; text-align: center; }
        button { background: var(--accent); color: white; font-weight: bold; }
        label { font-size: 0.75rem; color: #666; display: block; text-align: left; margin: 15px 0 -10px 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen">
        <h2 style="font-weight: 300;">Focus Timer</h2>
        <label>ポモドーロ</label>
        <select id="timerMode">
            <option value="25">25分 - 5分</option>
            <option value="50">50分 - 10分</option>
        </select>
        <label>ログ内容</label>
        <select id="activity">
            <option value="勉強">勉強 ✍️</option>
            <option value="読書">読書 📖</option>
            <option value="仕事">仕事 💻</option>
        </select>
        <button id="startBtn">集中スタート</button>
    </div>

    <div id="timer-screen" style="display:none;">
        <div id="status" class="status">FOCUS</div>
        <div class="timer" id="display">00:00</div>
        <button id="stopBtn" style="background:#444;">一時停止</button>
    </div>
</div>

<audio id="focusSound" src="雨が降る2.mp3" preload="auto"></audio>
<audio id="relaxSound" src="In That Mood.mp3" preload="auto"></audio>

<script>
    let timer;
    let timeLeft;
    let isFocus = true;
    let isPaused = false;
    let wakeLock = null;

    const focusAudio = document.getElementById('focusSound');
    const relaxAudio = document.getElementById('relaxSound');
    const stopBtn = document.getElementById('stopBtn');

    // --- 1. シームレスループ (5秒前で戻す) ---
    [focusAudio, relaxAudio].forEach(audio => {
        audio.addEventListener('timeupdate', function() {
            const buffer = 5.0; // 大胆にカットして途切れを防止
            if(this.currentTime > this.duration - buffer){
                this.currentTime = 0;
                this.play();
            }
        });
    });

    async function requestWakeLock() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }

    function startTimer() {
        timeLeft = parseInt(document.getElementById('timerMode').value) * 60;
        isFocus = true; isPaused = false;
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('timer-screen').style.display = 'block';
        requestWakeLock();
        runPhase();
    }

    function runPhase() {
        if (isFocus) {
            document.getElementById('status').textContent = "FOCUS";
            focusAudio.play(); relaxAudio.pause();
        } else {
            document.getElementById('status').textContent = "RELAX";
            relaxAudio.play(); focusAudio.pause();
        }
        startInterval();
    }

    function startInterval() {
        if(timer) clearInterval(timer);
        timer = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                document.getElementById('display').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (isFocus) {
                        logToObsidian(); // ここで記録
                        isFocus = false;
                        timeLeft = (document.getElementById('timerMode').value === "25") ? 5 * 60 : 10 * 60;
                        setTimeout(runPhase, 2000); // 記録完了を待ってから休憩へ
                    } else { resetApp(); }
                }
            }
        }, 1000);
    }

    // --- 2. Thino連携 (空行 + リスト形式) ---
    function logToObsidian() {
        const act = document.getElementById('activity').value;
        const mode = document.getElementById('timerMode').value;
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        
        // 前後に空行(\n)を入れ、実験成功した「- 時刻 内容」の形式にする
        const note = `\n- ${timeStr} 🍅${act} (${mode}分間集中) #log/focus\n`;
        
        const uri = `obsidian://advanced-uri?daily=true&data=${encodeURIComponent(note)}&mode=append`;
        window.location.href = uri;
    }

    function togglePause() {
        isPaused = !isPaused;
        stopBtn.textContent = isPaused ? "再開" : "一時停止";
        if (isPaused) { focusAudio.pause(); relaxAudio.pause(); }
        else { if (isFocus) focusAudio.play(); else relaxAudio.play(); }
    }

    function resetApp() {
        clearInterval(timer);
        if (wakeLock) wakeLock.release();
        focusAudio.pause(); relaxAudio.pause();
        document.getElementById('setup-screen').style.display = 'block';
        document.getElementById('timer-screen').style.display = 'none';
    }

    document.getElementById('startBtn').addEventListener('click', startTimer);
    stopBtn.addEventListener('click', togglePause);
</script>
</body>
</html>
